{{- range site.Params.includedFonts -}}
  {{- $familyName := .family -}}
  {{- $fontWeight := .weight | default "400" -}}
  {{- $fontStyle := .style | default "normal" -}}
  {{- $fontURL := (printf "/fonts/%s" .name) | relURL -}}
  {{- $ext := (replaceRE "^.*\\." "" .name) -}}

  <link rel="preload" href="{{ $fontURL }}" as="font" type="font/{{ $ext }}" crossorigin>
  <style>
    @font-face {
      font-family: '{{ $familyName }}';
      src: url('{{ $fontURL }}') format('{{ $ext }}');
      font-weight: {{ $fontWeight }};
      font-style: {{ $fontStyle }};
      font-display: swap;
    }
  </style>
{{ end -}}
