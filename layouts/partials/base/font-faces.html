<style>
  {{- range readDir "static/fonts" -}}
    {{- if and (not .IsDir) (eq (path.Ext .Name) ".woff2") -}}
      {{- $fileName := .Name -}}
      {{- $baseName := replaceRE "\\.woff2$" "" $fileName -}}
      {{- $familyKey := replaceRE "-(Thin|ExtraLight|Light|Regular|Medium|SemiBold|Bold|ExtraBold|Black)(Italic)?$" "" $baseName -}}
      {{- $variant := replaceRE (printf "^%s-" $familyKey) "" $baseName -}}
      {{- $fontStyle := "normal" -}}
      {{- $weightToken := $variant -}}
      {{- if hasSuffix $variant "Italic" -}}
        {{- $fontStyle = "italic" -}}
        {{- $weightToken = replaceRE "Italic$" "" $variant -}}
      {{- end -}}
      {{- $fontWeight := "400" -}}
      {{- if or (eq $weightToken "") (eq $weightToken "Regular") -}}
        {{- $fontWeight = "400" -}}
      {{- else if eq $weightToken "Thin" -}}
        {{- $fontWeight = "100" -}}
      {{- else if eq $weightToken "ExtraLight" -}}
        {{- $fontWeight = "200" -}}
      {{- else if eq $weightToken "Light" -}}
        {{- $fontWeight = "300" -}}
      {{- else if eq $weightToken "Medium" -}}
        {{- $fontWeight = "500" -}}
      {{- else if eq $weightToken "SemiBold" -}}
        {{- $fontWeight = "600" -}}
      {{- else if eq $weightToken "Bold" -}}
        {{- $fontWeight = "700" -}}
      {{- else if eq $weightToken "ExtraBold" -}}
        {{- $fontWeight = "800" -}}
      {{- else if eq $weightToken "Black" -}}
        {{- $fontWeight = "900" -}}
      {{- end -}}
      {{- $familyName := $familyKey | replaceRE "([A-Z]+)([A-Z][a-z])" "$1 $2" | replaceRE "([a-z0-9])([A-Z])" "$1 $2" -}}
      {{- $fontURL := printf "fonts/%s" $fileName | relURL -}}

      @font-face {
        {{ printf "font-family: '%s';" $familyName | safeCSS }}
        {{ printf "src: url('%s') format('woff2');" $fontURL | safeCSS }}
        {{ printf "font-weight: %s;" $fontWeight | safeCSS }}
        {{ printf "font-style: %s;" $fontStyle | safeCSS }}
        font-display: swap;
      }
    {{- end -}}
  {{- end -}}
</style>
